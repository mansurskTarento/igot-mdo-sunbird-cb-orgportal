<mat-card class="work-allocation-tool mt-4">
  <!-- #region (header) -->
  <div class="flex justify-between">
    <div class="work-allocation-title">Work Allocation Tool</div>
    <div class="header-actions">
      <button mat-button class="create-button flex justify-center items-center"
        routerLink="/app/home/work-allocation/create-workorder">Create Work Allocation</button>
    </div>
  </div>
  <!-- #endregion (header) -->

  <!-- #region (content) -->
  <mat-card-content>
    <mat-tab-group (selectedTabChange)="onTabChange($event)">
      <mat-tab label="Published">
        <ng-container [ngTemplateOutlet]="publishedTableTemplate"></ng-container>
      </mat-tab>
      <mat-tab label="Draft">
        <ng-container [ngTemplateOutlet]="draftTableTemplate"></ng-container>
      </mat-tab>
      <mat-tab label="Archived">
        <ng-container [ngTemplateOutlet]="archivedTableTemplate"></ng-container>
      </mat-tab>
    </mat-tab-group>

  </mat-card-content>
  <!-- #endregion (content) -->

  <ng-template #publishedTableTemplate>
    <ws-app-shared-table [tableData]="publishedTableData" [data]="publishedWATList"
      [paginationDetails]="publishedTablePaginationDetails" [menuItems]="publishedMenuItems"
      (searchKey)="onSearchKey($event)" (pageChange)="onPageChange($event)"
      (actionsClick)="onActionClick($event)"></ws-app-shared-table>
  </ng-template>

  <ng-template #draftTableTemplate>
    <ws-app-shared-table [tableData]="draftTableData" [data]="draftedWATList"
      [paginationDetails]="draftTablePaginationDetails" [menuItems]="draftMenuItems" (searchKey)="onSearchKey($event)"
      (pageChange)="onPageChange($event)" (actionsClick)="onActionClick($event)"></ws-app-shared-table>
  </ng-template>

  <ng-template #archivedTableTemplate>
    <ws-app-shared-table [tableData]="archivedTableData" [data]="archivedWATList"
      [paginationDetails]="archivedTablePaginationDetails" [menuItems]="archivedMenuItems"
      (searchKey)="onSearchKey($event)" (pageChange)="onPageChange($event)"
      (actionsClick)="onActionClick($event)"></ws-app-shared-table>
  </ng-template>

  <ng-template #emptyView>
    <div class="flex justify-center items-center w-full h-full">
      <div class="flex flex-col items-center gap-4">
        <img src="assets/images/empty-state.svg" alt="No Data" class="w-1/3 h-auto">
        <span class="text-gray-500">No work allocations found</span>
        <button mat-button class="create-button flex justify-center items-center"
          routerLink="/app/home/work-allocation/create-workorder">Create Work Allocation</button>
      </div>
    </div>
  </ng-template>

  <ng-template #emptyPage>
    <div class="flex justify-center items-center h-full w-full">
      <span>No data available</span>
    </div>
  </ng-template>
</mat-card>
